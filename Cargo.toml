[package]
name = "simple-design"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
arboard = "3.6.1"
base64 = "0.22.1"
earcutr = "0.5.0"
eframe = "0.36.0"
egui = { version = "0.36.0", features = ["serde"] }
epaint_default_fonts = "0.36.0"
fontdb = "0.24.0"
geo = "0.33.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny-skia = "0.12.0"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
