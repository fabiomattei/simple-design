app-id: io.github.fabiomattei.simple-design
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: simple-design

# eframe renders via glow/wgpu (GL or Vulkan) and rfd uses xdg-desktop-portal
# (zbus) for file dialogs -- no GTK, no home filesystem access needed.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: simple-design
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      # Cargo needs to fetch crates.io deps; no vendored offline sources yet.
      build-args:
        - --share=network
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/simple-design /app/bin/simple-design
      - install -Dm644 packaging/flatpak/io.github.fabiomattei.simple-design.desktop
        /app/share/applications/io.github.fabiomattei.simple-design.desktop
      - install -Dm644 packaging/flatpak/icon.png
        /app/share/icons/hicolor/256x256/apps/io.github.fabiomattei.simple-design.png
      - install -Dm644 packaging/flatpak/io.github.fabiomattei.simple-design.metainfo.xml
        /app/share/metainfo/io.github.fabiomattei.simple-design.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
